name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    name: lint
    if: github.event.action != 'closed' && !startsWith(github.head_ref, 'release-please--')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    name: test
    if: github.event.action != 'closed' && !startsWith(github.head_ref, 'release-please--')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: configure git identity (for tests)
        run: |
          git config --global user.name "ci-test"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: install git-cliff (same version as the Dockerfile)
        run: |
          v=$(sed -n 's/^ARG GIT_CLIFF_VERSION=//p' Dockerfile)
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${v}/git-cliff-${v}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar xz -C /usr/local/bin "git-cliff-${v}/git-cliff" --strip-components=1
          git-cliff --version
      - name: build
        run: go build ./...
      - name: test
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  docker:
    name: docker
    needs: [lint, test]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: ./.github/workflows/image.yaml
    with:
      tags: type=raw,value=pr-${{ github.event.number }}

  smoke:
    runs-on: ${{ matrix.runner }}
    name: smoke (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    needs: docker
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The runner pulls docker:// images without credentials, so this job
      # needs the tamci package to be public.
      - name: point the actions at the PR image
        run: sed -i "s|ghcr.io/dnd-it/tamci:[^']*|ghcr.io/dnd-it/tamci:pr-${{ github.event.number }}|" action.yaml actions/*/action.yaml

      - id: config
        uses: ./actions/config
        with:
          config_path: internal/matrix/testdata/valid-list-config.yml
      - name: assert config output
        env:
          MATRIX: ${{ steps.config.outputs.matrix }}
        run: |
          echo "$MATRIX" | jq .
          echo "$MATRIX" | jq -e 'type == "array" and length > 0' > /dev/null

      - name: create rollout fixture
        run: |
          mkdir -p fixture
          printf 'api:\n  image:\n    repository: example/api\n    tag: 1.0.0\n' > fixture/values.yaml
      - id: rollout
        uses: ./actions/rollout
        with:
          file: fixture/values.yaml
          mode: key
          key: api.image.tag
          value: 2.0.0
          token: ${{ github.token }}
          dry_run: "true"
      - name: assert rollout output
        env:
          DIFF: ${{ steps.rollout.outputs.diff }}
          FILES: ${{ steps.rollout.outputs.changed_files }}
        run: |
          echo "diff: $DIFF"
          echo "changed_files: $FILES"
          echo "$FILES" | grep -q 'fixture/values.yaml'
          echo "$DIFF" | grep -q '2.0.0'

      - id: release
        uses: ./actions/release
        with:
          version-strategy: semver
          tag-prefix: v
          dry-run: "true"
          github-token: ${{ github.token }}
      - name: assert release output
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SKIPPED: ${{ steps.release.outputs.skipped }}
          DRY_RUN: ${{ steps.release.outputs.dry-run }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "version=$VERSION skipped=$SKIPPED dry-run=$DRY_RUN tag=$TAG"
          [ "$DRY_RUN" = "true" ]
          [ -z "$TAG" ]
          [ -n "$VERSION" ] || [ "$SKIPPED" = "true" ]

      - uses: ./actions/summary
        with:
          string: '{"smoke":"ok"}'
          data_type: json

  cleanup:
    runs-on: ubuntu-latest
    name: cleanup pr image
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: delete pr image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: pr-${{ github.event.number }}
        run: |
          VERSION_ID=$(gh api \
            "/orgs/${OWNER}/packages/container/tamci/versions" \
            --jq ".[] | select(.metadata.container.tags[] == \"${TAG}\") | .id")
          if [ -n "$VERSION_ID" ]; then
            gh api --method DELETE \
              "/orgs/${OWNER}/packages/container/tamci/versions/${VERSION_ID}"
            echo "Deleted version ${VERSION_ID} (tag: ${TAG})"
          else
            echo "No version found with tag: ${TAG}"
          fi
