name: 'tamci'
description: 'Tamedia CI CLI — runs identically locally and inside GitHub Actions.'
author: 'DND-IT'

inputs:
  args:
    description: 'Arguments to pass to the tamci CLI (e.g. "summary --string ...")'
    required: false

runs:
  using: docker
  image: 'docker://ghcr.io/dnd-it/tamci:0.2.5' # x-release-please-version
  # Docker actions pass each args entry as a single argv element, so the
  # whole input would arrive as one token. Route through a shell to word-split.
  entrypoint: /bin/sh
  args:
    - -c
    - /tamci ${{ inputs.args }}

branding:
  icon: 'box'
  color: 'blue'
