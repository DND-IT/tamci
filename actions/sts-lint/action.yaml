name: 'action-sts-lint'
description: 'Check the octo-sts trust policies in .github/chainguard against the token broker rules: GitHub Actions issuer, caller pinned by repository ID and workflow file, write only from main or an environment.'
author: 'group:default/dai'

inputs:
  path:
    description: 'Directory holding the trust policies.'
    required: false
    default: '.github/chainguard'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/dnd-it/tamci:0.2.2' # x-release-please-version
  args: [sts-lint]

branding:
  icon: 'shield'
  color: 'blue'
